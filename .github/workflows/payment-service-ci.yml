name: Payment Service CI

on:
  push:
    branches: [dev, release]
    paths:
      - "backend/payment-service/**"
      - "backend/common/**"
      - ".github/workflows/payment-service-ci.yml"
  pull_request:
    branches: [dev, release]
    paths:
      - "backend/payment-service/**"
      - "backend/common/**"
      - ".github/workflows/payment-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: payment_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      INTERNAL_SERVICE_KEY: ci-internal-service-key
      PORTONE_API_SECRET: ci-portone-api-secret
      PORTONE_WEBHOOK_SECRET: ci-portone-webhook-secret
      PORTONE_STORE_ID: ci-portone-store
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root1234
    defaults:
      run:
        working-directory: backend/payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew clean test bootJar --no-daemon
