name: User Service CI

on:
  push:
    branches: [dev, release]
    paths:
      - "backend/user-service/**"
      - "backend/common/**"
      - ".github/workflows/user-service-ci.yml"
  pull_request:
    branches: [dev, release]
    paths:
      - "backend/user-service/**"
      - "backend/common/**"
      - ".github/workflows/user-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      INTERNAL_SERVICE_KEY: ci-internal-service-key
      JWT_SECRETKEY: ci-access-key-with-at-least-32-bytes
      JWT_REFRESHKEY: ci-refresh-key-with-at-least-32-bytes
      JWT_ACCESS_EXPIRATION_MS: "3600000"
      JWT_REFRESH_EXPIRATION_MS: "86400000"
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      KAKAO_CLIENT_ID: ci-kakao-client
      KAKAO_CLIENT_SECRET: ci-kakao-secret
    defaults:
      run:
        working-directory: backend/user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew clean test bootJar --no-daemon
