name: Post Service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/post-service/**"
      - "backend/common/**"
      - ".github/workflows/ci-post.yml"

  push:
    branches: [main]
    paths:
      - "backend/post-service/**"
      - "backend/common/**"
      - ".github/workflows/ci-post.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: post_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/post_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root1234

      INTERNAL_SERVICE_KEY: ci-internal-service-key

      # CI에서는 실제 Gemini 호출을 막음
      AI_ASSIST_ENABLED: "false"
      GEMINI_API_KEY: ci-dummy-gemini-key
      GOOGLE_API_KEY: ci-dummy-google-key

      CHAT_ALLOWED_ORIGINS: http://localhost:3000

      SERVICES_USER_SERVICE_URL: http://localhost:8081
      SERVICES_PAYMENT_SERVICE_URL: http://localhost:8083
      SERVICES_CHAT_SERVICE_URL: http://localhost:8084

    defaults:
      run:
        working-directory: backend/post-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/post-service/*.gradle*
            backend/post-service/gradle/wrapper/gradle-wrapper.properties
            backend/common/*.gradle*

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile
        run: ./gradlew clean classes testClasses --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-service-test-report
          path: |
            backend/post-service/build/reports/tests/test/**
            backend/post-service/build/test-results/test/**
          if-no-files-found: ignore
          retention-days: 7
