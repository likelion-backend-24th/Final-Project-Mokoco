name: Post Service CI

on:
  push:
    branches: [dev, release]
    paths:
      - "backend/post-service/**"
      - "backend/common/**"
      - ".github/workflows/post-service-ci.yml"
  pull_request:
    branches: [dev, release]
    paths:
      - "backend/post-service/**"
      - "backend/common/**"
      - ".github/workflows/post-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      INTERNAL_SERVICE_KEY: ci-internal-service-key
      AI_ASSIST_ENABLED: "false"
    defaults:
      run:
        working-directory: backend/post-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew clean test bootJar --no-daemon
