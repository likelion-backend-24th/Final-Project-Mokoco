name: User Service CI

on:
  pull_request:
    branches:
      - main
      - dev
      - release
    paths:
      - "backend/user-service/**"
      - "backend/common/**"
      - ".github/workflows/ci-user.yml"

  push:
    branches:
      - main
      - dev
      - release
    paths:
      - "backend/user-service/**"
      - "backend/common/**"
      - ".github/workflows/ci-user.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: user_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # CI용 DB 설정
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/user_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root1234

      # OAuth 설정은 Spring Context 로딩 시 placeholder 오류를 막기 위한 CI dummy 값
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      KAKAO_CLIENT_ID: ci-kakao-client-id
      KAKAO_CLIENT_SECRET: ci-kakao-client-secret

      # 내부 서비스 인증용 CI dummy 값
      INTERNAL_SERVICE_KEY: ci-internal-service-key

    defaults:
      run:
        working-directory: backend/user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/user-service/*.gradle*
            backend/user-service/gradle/wrapper/gradle-wrapper.properties
            backend/common/*.gradle*

      # deploy.yml은 실제 배포 때 GitHub Secret(USER_SERVICE_SECRET_YML)으로 이 파일을 만들어주는데,
      # 이 CI 워크플로엔 그 단계가 없었다 — jwt.secretKey 등이 base application.yaml엔 없고
      # 이 프로필 파일(git 추적 안 됨, 로컬에만 있음)에서만 오다 보니, CI에서는
      # PlaceholderResolutionException으로 컨텍스트 로딩 자체가 실패했다. 실제 키가 아닌
      # CI 전용 더미 값으로 같은 파일을 만들어 테스트가 최소한 기동은 되게 한다.
      - name: Create test secret file
        shell: bash
        run: |
          set -e
          mkdir -p src/main/resources
          cat > src/main/resources/application-secret.yml <<'EOF'
          jwt:
            secretKey: I/2HwMgdbvn/O1Zm82DlFvnids2po4zR7QLcXik67Ms=
            refreshKey: kVgxtW8FPkQCyphZqYyFqGe8KLrw07d/wbj17H9EWRU=
            access-expiration-ms: 1800000
            refresh-expiration-ms: 604800000
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build common and user-service
        run: ./gradlew clean classes testClasses --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-service-test-report
          path: |
            backend/user-service/build/reports/tests/test/**
            backend/user-service/build/test-results/test/**
          if-no-files-found: ignore
          retention-days: 7
