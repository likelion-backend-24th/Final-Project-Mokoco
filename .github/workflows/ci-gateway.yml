name: API Gateway CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/api-gateway/**"
      - ".github/workflows/ci-gateway.yml"

  push:
    branches: [main]
    paths:
      - "backend/api-gateway/**"
      - ".github/workflows/ci-gateway.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend/api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/api-gateway/*.gradle*
            backend/api-gateway/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile
        run: ./gradlew clean classes testClasses --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-test-report
          path: |
            backend/api-gateway/build/reports/tests/test/**
            backend/api-gateway/build/test-results/test/**
          if-no-files-found: ignore
          retention-days: 7
