name: CI/CD to AWS EC2

on:
  push:
    branches: [ release ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. 각 서비스별 application-secret.yml 파일 동적 생성
      - name: Create application-secret.yml files
        run: |
          mkdir -p backend/user-service/src/main/resources
          echo "${{ secrets.USER_SERVICE_SECRET_YML }}" > backend/user-service/src/main/resources/application-secret.yml

          mkdir -p backend/post-service/src/main/resources
          echo "${{ secrets.POST_SERVICE_SECRET_YML }}" > backend/post-service/src/main/resources/application-secret.yml

          # mkdir -p backend/payment-service/src/main/resources
          # echo "${{ secrets.PAYMENT_SERVICE_SECRET_YML }}" > backend/payment-service/src/main/resources/application-secret.yml

          # mkdir -p backend/api-gateway/src/main/resources
          # echo "${{ secrets.API_GATEWAY_SECRET_YML }}" > backend/api-gateway/src/main/resources/application-secret.yml

      # 2. 백엔드 서비스들 그레이들 빌드 (jar 생성)
      - name: Build Backend Services
        run: |
          cd backend/api-gateway && chmod +x gradlew && ./gradlew bootJar -x test
          cd ../user-service && chmod +x gradlew && ./gradlew bootJar -x test
          cd ../post-service && chmod +x gradlew && ./gradlew bootJar -x test
          cd ../payment-service && chmod +x gradlew && ./gradlew bootJar -x test

      # 3. 빌드된 결과물과 프로젝트 전체 파일을 EC2로 전송
      - name: Copy files to EC2 via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/mokoco"

      # 4. EC2에서 Docker Compose 재실행
      - name: Run docker compose on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/mokoco
            docker compose down
            docker compose up -d --build