name: CI/CD to AWS EC2

on:
  push:
    branches:
      - release

  # GitHub Actions 화면에서 수동 재배포도 가능하게
  workflow_dispatch:

concurrency:
  group: mokoco-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show deploy commit
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          git log -1 --oneline


      # =========================================================
      # 2. Java / Node 환경
      # =========================================================

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: >-
            ${{ runner.os }}-nextjs-
            ${{ hashFiles('frontend/package-lock.json') }}-
            ${{ hashFiles('frontend/src/**/*.js', 'frontend/src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-


      # =========================================================
      # 3. Secret 파일 생성
      # =========================================================

      - name: Create User Service secret file
        shell: bash
        run: |
          set -e
          mkdir -p backend/user-service/src/main/resources
          printf '%s' "${{ secrets.USER_SERVICE_SECRET_YML }}" \
            > backend/user-service/src/main/resources/application-secret.yml

      - name: Create Post Service secret file
        shell: bash
        run: |
          set -e
          mkdir -p backend/post-service/src/main/resources
          printf '%s' "${{ secrets.POST_SERVICE_SECRET_YML }}" \
            > backend/post-service/src/main/resources/application-secret.yml

      - name: Create Payment Service secret file
        shell: bash
        run: |
          set -e
          mkdir -p backend/payment-service/src/main/resources
          printf '%s' "${{ secrets.PAYMENT_SERVICE_SECRET_YML }}" \
            > backend/payment-service/src/main/resources/application-secret.yaml

      - name: Create Chat Service secret file
        shell: bash
        run: |
          set -e
          mkdir -p backend/chat-service/src/main/resources
          printf '%s' "${{ secrets.CHAT_SERVICE_SECRET_YML }}" \
            > backend/chat-service/src/main/resources/application-secret.yml


      # =========================================================
      # 4. Backend 전체 Build
      # =========================================================

      - name: Build API Gateway
        working-directory: backend/api-gateway
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --no-daemon

      - name: Build User Service
        working-directory: backend/user-service
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --no-daemon

      - name: Build Post Service
        working-directory: backend/post-service
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --no-daemon

      - name: Build Payment Service
        working-directory: backend/payment-service
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --no-daemon

      - name: Build Chat Service
        working-directory: backend/chat-service
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --no-daemon


      # =========================================================
      # 5. Frontend 전체 Build
      # =========================================================

      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_API_URL: ""
          NEXT_PUBLIC_PORTONE_STORE_ID: ${{ secrets.NEXT_PUBLIC_PORTONE_STORE_ID }}
          NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${{ secrets.NEXT_PUBLIC_PORTONE_CHANNEL_KEY }}
        run: |
          npm ci
          npm run build


      # =========================================================
      # 6. 빌드 결과 확인
      # =========================================================

      - name: Verify build outputs
        shell: bash
        run: |
          set -e

          echo "=== API Gateway ==="
          ls -lh backend/api-gateway/build/libs/

          echo "=== User Service ==="
          ls -lh backend/user-service/build/libs/

          echo "=== Post Service ==="
          ls -lh backend/post-service/build/libs/

          echo "=== Payment Service ==="
          ls -lh backend/payment-service/build/libs/

          echo "=== Chat Service ==="
          ls -lh backend/chat-service/build/libs/

          echo "=== Frontend ==="
          test -d frontend/.next/standalone
          test -d frontend/.next/static

          echo "All build outputs exist."


      # =========================================================
      # 7. EC2 디렉터리 준비
      # =========================================================

      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            mkdir -p /home/ubuntu/mokoco
            mkdir -p /home/ubuntu/mokoco/backend
            mkdir -p /home/ubuntu/mokoco/frontend
            mkdir -p /home/ubuntu/mokoco/infra


      # =========================================================
      # 8. 공통 설정 파일 전송
      # =========================================================

      - name: Copy shared config files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,infra,init.sql"
          target: "/home/ubuntu/mokoco"


      # =========================================================
      # 9. Backend 서비스 전송
      # =========================================================

      - name: Copy API Gateway to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/api-gateway"
          target: "/home/ubuntu/mokoco"

      - name: Copy User Service to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/user-service"
          target: "/home/ubuntu/mokoco"

      - name: Copy Post Service to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/post-service"
          target: "/home/ubuntu/mokoco"

      - name: Copy Payment Service to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/payment-service"
          target: "/home/ubuntu/mokoco"

      - name: Copy Chat Service to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/chat-service"
          target: "/home/ubuntu/mokoco"


      # =========================================================
      # 10. Frontend 빌드 결과 전송
      # =========================================================

      - name: Copy Frontend build output to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: >-
            frontend/Dockerfile,
            frontend/public,
            frontend/.next/standalone,
            frontend/.next/static
          target: "/home/ubuntu/mokoco"


      # =========================================================
      # 11. EC2 Docker Compose 재배포
      # =========================================================

      - name: Deploy Docker Compose on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            cd /home/ubuntu/mokoco

            echo "========================================="
            echo " Deploy commit"
            echo " ${{ github.sha }}"
            echo "========================================="

            echo "=== Current containers ==="
            docker compose ps -a || true

            echo "=== Build Docker images ==="
            docker compose build

            echo "=== Start containers ==="
            docker compose up -d --remove-orphans

            echo "=== Restart Caddy ==="
            docker compose restart caddy

            echo "=== Initial container state ==="
            docker compose ps -a


      # =========================================================
      # 12. 실제 EC2에서 서비스 검증
      # =========================================================

      - name: Verify services on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e

            cd /home/ubuntu/mokoco

            echo "=== Waiting for application startup ==="
            sleep 20

            echo "=== docker compose ps -a ==="
            docker compose ps -a

            echo ""
            echo "=== Running services ==="
            docker compose ps --status running

            echo ""
            echo "=== Checking exited/dead containers ==="

            FAILED_CONTAINERS="$(docker compose ps \
              --status exited \
              --status dead \
              --services 2>/dev/null || true)"

            if [ -n "$FAILED_CONTAINERS" ]; then
              echo "ERROR: exited/dead containers detected:"
              echo "$FAILED_CONTAINERS"

              echo ""
              echo "=== Recent Docker logs ==="
              docker compose logs --tail=200

              exit 1
            fi

            echo ""
            echo "=== Expected service checks ==="

            EXPECTED_SERVICES="
            api-gateway
            user-service
            post-service
            payment-service
            chat-service
            frontend
            caddy
            "

            RUNNING_SERVICES="$(docker compose ps --status running --services)"

            for service in $EXPECTED_SERVICES; do
              if ! echo "$RUNNING_SERVICES" | grep -qx "$service"; then
                echo ""
                echo "ERROR: $service is not running"

                echo ""
                echo "=== $service logs ==="
                docker compose logs --tail=200 "$service" || true

                exit 1
              fi

              echo "OK: $service"
            done

            echo ""
            echo "=== Post Service recent logs ==="
            docker compose logs --tail=50 post-service

            echo ""
            echo "=== API Gateway recent logs ==="
            docker compose logs --tail=50 api-gateway

            echo ""
            echo "========================================="
            echo " Deployment verification succeeded"
            echo "========================================="


      # =========================================================
      # 13. 실패 시 EC2 로그 확보
      # =========================================================

      - name: Print EC2 logs on failure
        if: failure()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/mokoco || exit 0

            echo "========================================="
            echo " Deployment failed - diagnostics"
            echo "========================================="

            echo ""
            echo "=== docker compose ps -a ==="
            docker compose ps -a || true

            echo ""
            echo "=== Last 200 compose logs ==="
            docker compose logs --tail=200 || true

            echo ""
            echo "=== Docker disk usage ==="
            docker system df || true