name: CI/CD to AWS EC2

on:
  push:
    branches: [ release ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      user-service: ${{ steps.filter.outputs.user-service }}
      post-service: ${{ steps.filter.outputs.post-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'backend/api-gateway/**'
            user-service:
              - 'backend/user-service/**'
            post-service:
              - 'backend/post-service/**'
            payment-service:
              - 'backend/payment-service/**'
            frontend:
              - 'frontend/**'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create secret files
        run: |
          mkdir -p backend/user-service/src/main/resources
          echo "${{ secrets.USER_SERVICE_SECRET_YML }}" > backend/user-service/src/main/resources/application-secret.yml
          mkdir -p backend/post-service/src/main/resources
          echo "${{ secrets.POST_SERVICE_SECRET_YML }}" > backend/post-service/src/main/resources/application-secret.yml
          mkdir -p backend/payment-service/src/main/resources
          echo "${{ secrets.PAYMENT_SERVICE_SECRET_YML }}" > backend/payment-service/src/main/resources/application-secret.yaml

      - name: Build API Gateway
        if: steps.filter.outputs.api-gateway == 'true'
        run: cd backend/api-gateway && chmod +x gradlew && ./gradlew bootJar -x test

      - name: Build User Service
        if: steps.filter.outputs.user-service == 'true'
        run: cd backend/user-service && chmod +x gradlew && ./gradlew bootJar -x test

      - name: Build Post Service
        if: steps.filter.outputs.post-service == 'true'
        run: cd backend/post-service && chmod +x gradlew && ./gradlew bootJar -x test

      - name: Build Payment Service
        if: steps.filter.outputs.payment-service == 'true'
        run: cd backend/payment-service && chmod +x gradlew && ./gradlew bootJar -x test

      - name: Build Frontend
        if: steps.filter.outputs.frontend == 'true'
        env:
          NEXT_PUBLIC_BACKEND_API_URL: ""
          NEXT_PUBLIC_PORTONE_STORE_ID: ${{ secrets.NEXT_PUBLIC_PORTONE_STORE_ID }}
          NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${{ secrets.NEXT_PUBLIC_PORTONE_CHANNEL_KEY }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Determine services to redeploy
        id: services
        run: |
          SERVICES=""
          if [ "${{ steps.filter.outputs.api-gateway }}" = "true" ]; then SERVICES="$SERVICES api-gateway"; fi
          if [ "${{ steps.filter.outputs.user-service }}" = "true" ]; then SERVICES="$SERVICES user-service"; fi
          if [ "${{ steps.filter.outputs.post-service }}" = "true" ]; then SERVICES="$SERVICES post-service"; fi
          if [ "${{ steps.filter.outputs.payment-service }}" = "true" ]; then SERVICES="$SERVICES payment-service"; fi
          if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then SERVICES="$SERVICES frontend"; fi
          echo "list=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "changed services:${SERVICES:- (none — compose/infra 파일만 변경, 전체 대상으로 up)}"

      - name: Copy files to EC2 via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/mokoco"

      - name: Run docker compose on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/mokoco
            # paths-filter가 감지한 서비스만 빌드/재생성한다. 목록이 비어있으면(=compose/infra 파일만 바뀜)
            # 인자 없이 up 을 호출해 전체를 대상으로 재점검하되, 실제로 이미지가 안 바뀐 서비스는 재생성되지 않는다.
            docker compose up -d --build --remove-orphans ${{ steps.services.outputs.list }}
            # Caddyfile(바인드 마운트)이 바뀌어도 컨테이너는 재생성되지 않으므로 설정을 다시 읽도록 재시작
            docker compose restart caddy
            docker compose ps