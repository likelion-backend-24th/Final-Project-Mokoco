# WebSocket 업그레이드 시에만 Connection: upgrade 를 보내도록 매핑
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name 18.212.91.33 18.212.91.33.nip.io;

    # Docker 내장 DNS로 매 요청마다 업스트림 호스트명을 다시 해석한다.
    # (컨테이너가 재생성되어 IP가 바뀌어도 nginx 재시작 없이 따라가도록 -> 502 방지)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API 요청
    location /api/ {
        set $upstream_gateway http://mokoco-api-gateway:8000;
        proxy_pass $upstream_gateway$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 소셜 로그인 진입 경로만 백엔드로 토스
    location /oauth2/authorization/ {
        set $upstream_user_oauth http://mokoco-user-service:8081;
        proxy_pass $upstream_user_oauth$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login/oauth2/ {
        set $upstream_user_login http://mokoco-user-service:8081;
        proxy_pass $upstream_user_login$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 그 외 모든 요청(프론트엔드 및 /oauth2/redirect 포함)은 프론트엔드로
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
