server {
    listen 80;
    server_name 18.212.91.33 18.212.91.33.nip.io;

    # API 요청
    location /api/ {
        proxy_pass http://mokoco-api-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 소셜 로그인 진입 경로만 백엔드로 토스
    location /oauth2/authorization/ {
        proxy_pass http://mokoco-user-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login/oauth2/ {
        proxy_pass http://mokoco-user-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 그 외 모든 요청(프론트엔드 및 /oauth2/redirect 포함)은 프론트엔드로
    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}