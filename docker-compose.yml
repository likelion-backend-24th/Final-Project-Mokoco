services:
  # --------------------
  # Database
  # --------------------
  mysql:
    image: mysql:8.0
    container_name: mokoco-mysql
    restart: always
    # 1GB RAM 인스턴스에서 MySQL 메모리 사용량을 낮춘다 (기본값이면 ~400MB 이상 점유)
    command: >
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
      --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mokoco-net
    # 백엔드가 "MySQL 연결 거부"로 죽지 않도록, MySQL이 실제 접속을 받을 수 있을 때만 healthy 처리
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # --------------------
  # Nginx (Reverse Proxy)
  # --------------------
  nginx:
    image: nginx:alpine
    container_name: mokoco-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - api-gateway
    networks:
      - mokoco-net

  # --------------------
  # Backend: API Gateway
  # --------------------
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: mokoco-api-gateway
    restart: always
    # Nginx가 80번을 받아서 내부 네트워크로 토스하므로 외부 ports 매핑은 제거합니다.
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 힙 상한 (1GB RAM 인스턴스에서 JVM 3개가 메모리를 다 먹지 않도록)
      - JAVA_TOOL_OPTIONS=-Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -Xss512k
    depends_on:
      - mysql
    networks:
      - mokoco-net

  # --------------------
  # Backend: User Service
  # --------------------
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: mokoco-user-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx200m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -Xss512k
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mokoco-net

  # --------------------
  # Backend: Post Service
  # --------------------
  post-service:
    build:
      context: ./backend/post-service
      dockerfile: Dockerfile
    container_name: mokoco-post-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx240m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -Xss512k
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mokoco-net

  # --------------------
  # Backend: Payment Service
  # --------------------
  # payment-service:
  #   build:
  #     context: ./backend/payment-service
  #     dockerfile: Dockerfile
  #   container_name: mokoco-payment-service
  #   restart: always
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=prod
  #     - JAVA_TOOL_OPTIONS=-Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -Xss512k
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - mokoco-net

  # --------------------
  # Frontend (Next.js)
  # --------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_API_URL=http://18.212.91.33.nip.io/api
    container_name: mokoco-frontend
    restart: always
    # Nginx가 80번을 대신 받으므로 3000포트 매핑은 제거합니다.
    environment:
      - NODE_ENV=production
    depends_on:
      - api-gateway
    networks:
      - mokoco-net

volumes:
  mysql_data:

networks:
  mokoco-net:
    driver: bridge