services:
  # --------------------
  # Database
  # --------------------
  mysql:
    image: mysql:8.0
    container_name: mokoco-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      # MYSQL_DATABASE: mokocodb # 이 줄은 삭제 또는 주석 처리
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mokoco-net

  # --------------------
  # Backend: API Gateway
  # --------------------
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: mokoco-api-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 필요한 환경 변수 (DB 연결이나 서비스 디스커버리 등) 추가
    depends_on:
      - mysql
    networks:
      - mokoco-net

  # --------------------
  # Backend: User Service
  # --------------------
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: mokoco-user-service
    restart: always
    # 내부 포트이므로 외부 포트 매핑(ports)은 생략합니다.
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - mysql
    networks:
      - mokoco-net

  # --------------------
  # Backend: Post Service
  # --------------------
  post-service:
    build:
      context: ./backend/post-service
      dockerfile: Dockerfile
    container_name: mokoco-post-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - mysql
    networks:
      - mokoco-net

  # --------------------
  # Backend: Payment Service
  # --------------------
  # payment-service:
  #   build:
  #     context: ./backend/payment-service
  #     dockerfile: Dockerfile
  #   container_name: mokoco-payment-service
  #   restart: always
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=prod
  #   depends_on:
  #     - mysql
  #   networks:
  #     - mokoco-net

  # --------------------
  # Frontend (Next.js)
  # --------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mokoco-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 프론트엔드에서 API Gateway를 호출할 때 사용할 주소 설정 (예: http://api-gateway:8000 또는 EC2 퍼블릭 IP)
    depends_on:
      - api-gateway
    networks:
      - mokoco-net

volumes:
  mysql_data:

networks:
  mokoco-net:
    driver: bridge