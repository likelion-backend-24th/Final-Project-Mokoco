server:
  port: 8083

spring:
  application:
    name: payment-service
  profiles:
    include: secret

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  datasource:
    url: jdbc:mysql://mysql:3306/payment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false

post-service:
  base-url: http://mokoco-post-service:8082

portone:
  base-url: https://api.portone.io
  # api-secret / webhook-secret / store-id 는 application-secret.yaml (GitHub Secret) 에서 주입
