server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "https://32.199.114.190.nip.io"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: http://mokoco-user-service:8081
          predicates:
            - Path=/api/auth/**, /api/users/**, /oauth2/**, /login/oauth2/**

        - id: post-service
          uri: http://mokoco-post-service:8082
          predicates:
            - Path=/posts/**, /api/chat-rooms/**, /fix-deals/**

        - id: payment-service
          uri: http://mokoco-payment-service:8083
          predicates:
            - Path=/payments/**