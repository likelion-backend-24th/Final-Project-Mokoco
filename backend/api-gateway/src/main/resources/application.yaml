server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=X-User-Email
        - RemoveRequestHeader=X-Internal-Service-Key
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**, /oauth2/**

        - id: user-service-policy
          uri: http://localhost:8081
          predicates:
            - Path=/policy/**

        - id: post-contracts
          uri: ${services.post-service.url:http://localhost:8082}
          predicates:
            - Path=/api/chat-rooms/*/contract, /api/chat-rooms/*/contract/**

        - id: chat-websocket
          uri: ${services.chat-service.ws-url:ws://localhost:8084}
          predicates:
            - Path=/ws/chat, /ws/chat/**

        - id: chat-service
          uri: ${services.chat-service.url:http://localhost:8084}
          predicates:
            - Path=/api/chat-rooms/**, /chat/**

        - id: post-service
          uri: ${services.post-service.url:http://localhost:8082}
          predicates:
            - Path=/posts/**, /fix-deals/**, /notifications/**, /reviews/**, /api/ai/**, /profile/**, /resumes/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/payments/**
