server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**, /oauth2/**

        - id: user-service-policy
          uri: http://localhost:8081
          predicates:
            - Path=/policy/**

        - id: post-service
          uri: http://localhost:8082
          predicates:
            - Path=/posts/**, /api/chat-rooms/**, /fix-deals/**, /notifications/**, /reviews/**, /api/ai/**, /profile/**, /resumes/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/payments/**
