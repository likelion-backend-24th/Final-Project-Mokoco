server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "https://32.199.114.190.nip.io"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: http://mokoco-user-service:8081
          predicates:
            - Path=/api/auth/**, /api/users/**, /oauth2/**, /login/oauth2/**

        # 프론트(브라우저)가 보내는 /api/* — /api 를 떼고 post-service 로 (컨트롤러는 /posts, /fix-deals)
        - id: post-service-api
          uri: http://mokoco-post-service:8082
          predicates:
            - Path=/api/posts/**, /api/fix-deals/**, /api/images/**
          filters:
            - StripPrefix=1

        # 채팅 컨트롤러는 이미 /api/chat-rooms 매핑이라 접두어 유지
        - id: post-service-chat
          uri: http://mokoco-post-service:8082
          predicates:
            - Path=/api/chat-rooms/**

        # SSR(Next 서버)이 게이트웨이로 직접 부르는 접두어 없는 경로
        - id: post-service-direct
          uri: http://mokoco-post-service:8082
          predicates:
            - Path=/posts/**, /fix-deals/**, /images/**

        # Next BFF(/api/payments/*)가 접두어 없이 /payments 로 호출한다
        - id: payment-service
          uri: http://mokoco-payment-service:8083
          predicates:
            - Path=/payments/**