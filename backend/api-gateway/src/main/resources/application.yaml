server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**, /oauth2/**

        - id: post-service
          uri: http://localhost:8082
          predicates:
            - Path=/posts/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/payments/**