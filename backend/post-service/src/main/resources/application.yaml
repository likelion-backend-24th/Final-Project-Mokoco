server:
  port: 8082 # user-service가 8081을 쓰고 있으므로 포트 변경

spring:
  profiles:
    include: secret
  application:
    name: post-service # 서비스 이름 변경

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    # post_db를 chat-service와 공유하므로, 각 서비스가 자기 이력만 추적하도록 테이블을 따로 둔다
    # (chat-service는 flyway_schema_history_chat 사용 — 그쪽 application.yaml 참고).
    table: flyway_schema_history
    # 과거 다른 브랜치 배포로 3~6번 마이그레이션이 이미 적용 기록만 남아있고 파일은 release
    # 저장소에 없다 — release는 그 이력을 새로 만들어 관리하지 않으므로, 로컬에 없는 적용
    # 이력(missing)은 검증에서 제외한다(future는 Boot 기본값이라 같이 명시).
    ignore-migration-patterns: "*:missing,*:future"

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  datasource:
    url: jdbc:mysql://mysql:3306/post_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false

file:
  upload-dir: ./uploads/post-images # 이미지 파일이 저장되는 로컬 경로
  base-url: http://localhost:8082/images # 저장된 이미지에 접근하는 공개 URL


services:
  user-service:
    url: http://mokoco-user-service:8081
  payment-service:
    url: http://mokoco-payment-service:8083
  chat-service:
    url: http://mokoco-chat-service:8084
internal:
  service-key: ${INTERNAL_SERVICE_KEY}

chat:
  # WebSocket(STOMP) 핸드셰이크 Origin 허용 목록 (콤마 구분). prod 도메인 + 로컬 개발용.
  allowed-origins: ${CHAT_ALLOWED_ORIGINS:https://32.199.114.190.nip.io,http://localhost:3000}

ai:
  enabled: ${AI_ASSIST_ENABLED:true}
  gemini:
    api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
  limit:
    per-minute: ${AI_REQUESTS_PER_MINUTE:3}
    per-day: ${AI_REQUESTS_PER_DAY:20}
    global-per-day: ${AI_GLOBAL_REQUESTS_PER_DAY:500}
