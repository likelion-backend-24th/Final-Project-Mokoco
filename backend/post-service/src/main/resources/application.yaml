server:
  port: 8082 # user-service가 8081을 쓰고 있으므로 포트 변경

spring:
  profiles:
    include: secret
  application:
    name: post-service # 서비스 이름 변경

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  datasource:
    url: jdbc:mysql://localhost:3306/post_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true # DB명 구분 (post_db 등)
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false

file:
  upload-dir: ./uploads/post-images # 이미지 파일이 저장되는 로컬 경로
  base-url: http://localhost:8082/images # 저장된 이미지에 접근하는 공개 URL


services:
  user-service:
    url: http://localhost:8081
internal:
  service-key: ${INTERNAL_SERVICE_KEY}

chat:
  allowed-origins: ${CHAT_ALLOWED_ORIGINS:http://localhost:3000}

post:
  reminder:
    cron: ${POST_REMINDER_CRON:0 0 * * * *} # 매 정시 실행
    no-proposal-days: ${POST_REMINDER_NO_PROPOSAL_DAYS:3}   # 제안이 없을 때 알림+끌어올리기까지 걸리는 일수
    not-adopted-days: ${POST_REMINDER_NOT_ADOPTED_DAYS:3}   # 제안을 채택하지 않았을 때 알림까지 걸리는 일수

ai:
  enabled: ${AI_ASSIST_ENABLED:true}
  gemini:
    api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
  limit:
    per-minute: ${AI_REQUESTS_PER_MINUTE:3}
    per-day: ${AI_REQUESTS_PER_DAY:20}
    global-per-day: ${AI_GLOBAL_REQUESTS_PER_DAY:500}
