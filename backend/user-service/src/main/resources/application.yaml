server:
  port: 8081
  # Caddy/게이트웨이 뒤에 있으므로 X-Forwarded-* 를 신뢰해 https/호스트를 인식
  forward-headers-strategy: framework

spring:
  profiles:
    include: secret
  application:
    name: user-service

  jpa:
    hibernate:
      ddl-auto: update # 혹은 create
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  datasource:
    url: jdbc:mysql://mysql:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 소셜 로그인 설정 추가
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "https://32.199.114.190.nip.io/login/oauth2/code/google"
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "https://32.199.114.190.nip.io/login/oauth2/code/kakao"
            # account_email 은 카카오 비즈앱 전환이 필요해 제외. 이메일은 kakao user id 로 합성한다.
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
internal:
  service-key: ${INTERNAL_SERVICE_KEY}

# Kakao Local API (좌표 -> 행정구역 변환). REST API 키는 Kakao OAuth client-id 와 동일한 값.
# 비어 있으면 지역 저장이 502(REGION_LOOKUP_FAILED)로 실패하지만 서비스 기동에는 영향 없음.
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
