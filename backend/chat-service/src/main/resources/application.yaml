server:
  port: 8084 # user-service 8081 / post-service 8082 / payment-service 8083 다음

spring:
  profiles:
    include: secret
  application:
    name: chat-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    # post_db를 post-service와 공유하므로, 이력 테이블 이름을 따로 둬서 두 서비스의 마이그레이션
    # 기록이 섞이지 않게 한다(post-service는 기본값 flyway_schema_history를 그대로 씀).
    table: flyway_schema_history_chat

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # post-service와 같은 DB를 그대로 공유한다 (DB 분리는 이번 범위 밖 — chat_rooms/chat_messages
  # 테이블은 옮기지 않고, 접속하는 서비스만 post-service에서 chat-service로 바뀐다).
  datasource:
    url: jdbc:mysql://mysql:3306/post_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false

services:
  user-service:
    url: http://mokoco-user-service:8081
  post-service:
    url: http://mokoco-post-service:8082

internal:
  service-key: ${INTERNAL_SERVICE_KEY}

chat:
  # WebSocket(STOMP) 핸드셰이크 Origin 허용 목록 (콤마 구분). prod 도메인 + 로컬 개발용.
  allowed-origins: ${CHAT_ALLOWED_ORIGINS:https://32.199.114.190.nip.io,http://localhost:3000}
  # 채팅 첨부파일 저장 경로. docker-compose의 chat_attachments 볼륨이 이 경로에 마운트된다.
  attachment-dir: ${CHAT_ATTACHMENT_DIR:./private-chat-files}
